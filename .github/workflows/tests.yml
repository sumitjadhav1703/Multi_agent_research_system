name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # V1 and V2 pin different langgraph versions, so each gets its own interpreter.
  v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: v1/requirements.txt
      - name: Install V1 dependencies
        run: python -m pip install -r v1/requirements.txt
      - name: Run V1 offline tests
        run: cd v1 && python -m unittest discover -s tests -v
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install V2 backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run V2 backend offline tests
        env:
          USE_MOCK_PROVIDER: "true"
        run: PYTHONPATH=. python -m unittest discover -s backend/tests -v
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run eval tests
        env:
          PYTHONPATH: .
          USE_MOCK_PROVIDER: "true"
        run: python -m unittest discover -s evals/tests -v
      - name: Run deterministic eval self-check
        env:
          PYTHONPATH: .
          USE_MOCK_PROVIDER: "true"
        run: python -m evals.cli deterministic
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install MCP Worker dependencies
        working-directory: mcp-server
        run: npm ci
      - name: Test and typecheck the MCP Worker
        working-directory: mcp-server
        run: npm test && npx tsc --noEmit
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the API image (no push)
        run: docker build .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install console dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck, test, and build the console
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm test && npm run build
