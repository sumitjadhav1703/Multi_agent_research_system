name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install V1 dependencies
        run: python -m pip install -r requirements.txt
      - name: Run V1 offline tests
        run: python -m unittest discover -s tests -v
      - name: Install V2 backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run V2 backend offline tests
        env:
          USE_MOCK_PROVIDER: "true"
        run: PYTHONPATH=. python -m unittest discover -s backend/tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install console dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck, test, and build the console
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm test && npm run build
